<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <!-- Font Awesome for Spotify-like icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* GENERAL STYLES & CORE COLORS */
        body {
            font-family: 'Montserrat', sans-serif, Arial;
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden; /* Stops external dual scroll bars */
        }

        a {
            text-decoration: none;
            color: #ffffff;
        }

        .main-container {
            display: flex;
            height: 100vh;
            padding: 0.5rem;
            box-sizing: border-box;
            gap: 0.5rem;
            padding-bottom: 85px; /* Leaves space for the fixed player */
        }

        /* SIDEBAR LAYOUT */
        .sidebar {
            background-color: #000000;
            width: 320px;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-links {
            background-color: #121212;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 112px;
            padding: 0.5rem 1.25rem;
        }

        .nav-option {
            line-height: 2.5rem;
            opacity: 0.7;
            padding: 0.25rem 0.5rem;
            transition: opacity 0.2s ease;
        }

        .nav-option:hover {
            opacity: 1;
        }

        .nav-option i {
            font-size: 1.25rem;
            margin-right: 1.25rem;
        }

        .nav-option a {
            font-size: 1rem;
            font-weight: 700;
        }

        /* LIBRARY SECTION */
        .library {
            background-color: #121212;
            border-radius: 0.5rem;
            height: 100%;
            padding: 0.5rem 1rem;
        }

        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-icon {
            font-size: 1.25rem;
            opacity: 0.7;
            cursor: pointer;
            padding-right: 0.5rem;
        }

        .add-icon:hover {
            opacity: 1;
        }

        .lib-box {
            background-color: #242424;
            height: 8rem;
            border-radius: 0.75rem;
            margin: 0.75rem 0 1.5rem 0;
            padding: 0.75rem 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .box-p1 {
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
        }

        .box-p2 {
            font-size: 0.85rem;
            opacity: 0.85;
            margin: 0;
        }

        .badge {
            background-color: #ffffff;
            border: none;
            border-radius: 100px;
            padding: 0.25rem 1rem;
            font-weight: 700;
            margin-top: 0.5rem;
            height: 2rem;
            width: fit-content;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .badge:hover {
            transform: scale(1.05);
        }

        /* MAIN CONTENT DISPLAY AREA */
        .main-content {
            background-color: #121212;
            flex: 1;
            border-radius: 0.5rem;
            overflow: auto; /* Creates specific scrollable body area */
            padding: 0 1.5rem;
        }

        .sticky-nav {
            position: sticky;
            top: 0;
            background-color: #121212;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            z-index: 10;
        }

        .sticky-nav-icons i {
            background-color: #000000;
            border-radius: 50%;
            padding: 0.5rem;
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .sticky-nav-options {
            display: flex;
            align-items: center;
        }

        .nav-item {
            margin-right: 1rem;
        }

        .dark-badge {
            background-color: #000000;
            color: #ffffff;
        }

        .user-icon {
            background-color: #000000;
            border-radius: 50%;
            padding: 0.5rem;
            cursor: pointer;
        }

        /* MUSIC SHELF CARDS */
        h2 {
            font-size: 1.5rem;
            margin-top: 1.5rem;
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .card {
            background-color: #181818;
            width: 180px;
            padding: 1rem;
            border-radius: 0.5rem;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            background-color: #282828;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 0.35rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .card-title {
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info {
            font-size: 0.8rem;
            opacity: 0.7;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .footer {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .line {
            width: 100%;
            height: 1px;
            background-color: #ffffff;
            opacity: 0.1;
        }

        /* PERSISTENT BOTTOM MUSIC PLAYER */
        .music-player {
            background-color: #000000;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            box-sizing: border-box;
            z-index: 20;
        }

        /* Left - Album Section */
        .album {
            width: 25%;
            display: flex;
            align-items: center;
        }

        .album-img {
            height: 56px;
            width: 56px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 1rem;
        }

        .album-text {
            display: flex;
            flex-direction: column;
            margin-right: 1.25rem;
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .track-title:hover {
            text-decoration: underline;
        }

        .track-artist {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 0.2rem;
        }

        .track-artist:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .album-icon {
            opacity: 0.7;
            cursor: pointer;
        }

        .album-icon:hover {
            opacity: 1;
        }

        /* Middle - Media Controls & Timeline */
        .player {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .player-control-icon {
            font-size: 1rem;
            opacity: 0.7;
            cursor: pointer;
        }

        .player-control-icon:hover {
            opacity: 1;
        }

        .play-btn {
            font-size: 2rem;
            opacity: 1;
            transition: transform 0.1s ease;
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        .playback-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .curr-time, .tot-time {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .progress-bar, .volume-bar {
            width: 70%;
            appearance: none;
            background-color: #4d4d4d;
            height: 4px;
            border-radius: 2px;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb, .volume-bar::-webkit-slider-thumb {
            appearance: none;
            height: 12px;
            width: 12px;
            background-color: #1bd760; /* Spotify Green */
            border-radius: 50%;
        }

        /* Right - Volume Utilities */
        .controls {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
        }

        .control-icon {
            opacity: 0.7;
            cursor: pointer;
        }

        .control-icon:hover {
            opacity: 1;
        }

        .volume-bar {
            width: 100px;
        }

        /* MOBILE RESPONSIVENESS ADJUSTMENTS */
        @media (max-width: 768px) {
            .sidebar {
                display: none; /* Hides sidebar on compact displays */
            }
            .hide-mobile {
                display: none;
            }
            .album {
                width: 40%;
            }
